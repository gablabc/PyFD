[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfd"
authors = [
    {name = "Gabriel Laberge", email = "gabriellaberge57@gmail.com"},
]
description = "Functional Decompositions of Black-Boxes"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  'graphviz',
  'numpy>=2.0.0,<2.4',
  'matplotlib',
  'scikit-learn>=1.0',
  'pandas',
  'tqdm>=4.27.0',
  'shap',
  'xgboost',
  'interpret-core<0.7.6'
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
  'sphinx',
  'nbsphinx',
  'ipywidgets',
  'numpydoc',
  'pydata-sphinx-theme'
]
dev = [
  'black~=26.1',
  'flake8~=7.1',
  'flake8-bugbear~=22.8',
  'mypy~=1.3'
]
test = [
  'pytest~=7.3',
  'pytest-cov~=4.1',
]

[tool.setuptools]
packages = [
  "pyfd",
  "pyfd.tree_shap"
]

[tool.setuptools.dynamic]
version = {attr = "pyfd.__version__"}


[[tool.mypy.overrides]]
module = ['sklearn.*', 'yaml.*', 'joblib', 'pyfd.*', 'tqdm']
ignore_missing_imports = true

[tool.black]
line-length = 88

